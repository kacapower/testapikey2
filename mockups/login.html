<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PW · Sign in</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<div class="center-page">
  <div class="auth-card">
    <h1>PW<span>·</span>app</h1>
    <p>Doubts, notes and the community — in one place.</p>

    <form onsubmit="toast('Mockup only — no auth wired up'); return false">
      <label for="e">Email</label>
      <input id="e" type="email" name="email" autocomplete="email" placeholder="you@example.com" required>

      <label for="p">Password</label>
      <input id="p" type="password" name="password" autocomplete="current-password" placeholder="••••••••" required>

      <div style="margin-top:18px">
        <button class="btn block" type="submit">Sign in</button>
      </div>
      <div style="margin-top:10px">
        <button class="btn ghost block" type="button" data-toast="Mockup only">Create an account</button>
      </div>
    </form>

    <p style="margin:18px 0 0">
      <a href="#" data-toast="Mockup only">Forgot password?</a>
    </p>

    <div class="meta" style="justify-content:center;margin-top:18px">
      <span class="badge solved">Autofill test</span>
      <span>let the browser fill this form — inputs should stay dark</span>
    </div>

    <div style="margin-top:16px;text-align:center">
      <a href="index.html">← back to mockup index</a>
    </div>
  </div>
</div>

<div class="toast"></div>

<script src="mock.js"></script>
</body>
</html>
