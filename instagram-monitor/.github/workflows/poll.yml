name: hourly-poll

on:
  schedule:
    # Every hour, on the hour (UTC). Free scheduled workflows are
    # available on public repos; private repos have a monthly quota.
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger monitor poll
        run: |
          curl -sf -X POST "${{ vars.MONITOR_URL }}/api/poll" \
            -H "x-poll-token: ${{ secrets.POLL_TOKEN }}" \
            --max-time 300 || echo "Poll endpoint unreachable (instance may be asleep)"
