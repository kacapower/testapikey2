<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Max</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #030409; font-family: 'Segoe UI', system-ui, sans-serif; color: #dfe6ff; }
        canvas { display: block; cursor: crosshair; }

        #fps {
            position: fixed; top: 12px; right: 14px; z-index: 20;
            font-size: 12px; letter-spacing: 1px; color: rgba(220,230,255,0.7);
            background: rgba(10,12,30,0.6); padding: 4px 10px; border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        #hint {
            position: fixed; top: 12px; left: 14px; z-index: 20;
            font-size: 11px; color: rgba(220,230,255,0.5); pointer-events: none;
            line-height: 1.6;
        }

        #ui {
            position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
            z-index: 20; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
            max-width: 94vw; background: rgba(8,10,26,0.78); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 12px 14px;
        }

        .group { display: flex; flex-direction: column; gap: 6px; }
        .group > span { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: rgba(200,210,255,0.55); }

        .row { display: flex; gap: 6px; flex-wrap: wrap; }

        button {
            background: rgba(255,255,255,0.07); color: #dfe6ff; border: 1px solid rgba(255,255,255,0.14);
            border-radius: 10px; padding: 6px 11px; font-size: 12px; cursor: pointer;
            transition: background 0.15s, transform 0.15s, box-shadow 0.15s; user-select: none;
        }
        button:hover { background: rgba(255,255,255,0.16); transform: translateY(-1px); }
        button.active { background: rgba(120,150,255,0.35); border-color: rgba(150,180,255,0.6); box-shadow: 0 0 14px rgba(120,150,255,0.4); }

        input[type=range] { width: 120px; accent-color: #8ab4ff; }
        label { font-size: 11px; color: rgba(220,230,255,0.75); display: flex; align-items: center; gap: 6px; cursor: pointer; }
        input[type=checkbox] { accent-color: #8ab4ff; }

        .divider { width: 1px; background: rgba(255,255,255,0.1); margin: 0 2px; }

        @media (max-width: 720px) { #ui { gap: 8px; padding: 10px; } .divider { display: none; } }
    </style>
</head>
<body>
    <canvas id="galaxy"></canvas>
    <div id="fps">-- FPS</div>
    <div id="hint">
        1-4 modes · SPACE spin · M mouse fx<br>
        F fullscreen · C constellation lines
    </div>
    <div id="ui">
        <div class="group">
            <span>Mode</span>
            <div class="row">
                <button id="mGalaxy" class="active">Galaxy</button>
                <button id="mRing">Ring</button>
                <button id="mHole">Black Hole</button>
                <button id="mFire">Fireworks</button>
            </div>
        </div>
        <div class="divider"></div>
        <div class="group">
            <span>Theme</span>
            <div class="row">
                <button id="tNebula" class="active">Nebula</button>
                <button id="tAurora">Aurora</button>
                <button id="tSunset">Sunset</button>
                <button id="tMono">Mono</button>
            </div>
        </div>
        <div class="divider"></div>
        <div class="group">
            <span>Particles <b id="pCount">500</b></span>
            <input type="range" id="sParticles" min="50" max="1200" step="25" value="500">
        </div>
        <div class="group">
            <span>Speed <b id="pSpeed">1.0</b></span>
            <input type="range" id="sSpeed" min="0.1" max="3" step="0.05" value="1">
        </div>
        <div class="divider"></div>
        <div class="group">
            <span>FX</span>
            <div class="row" style="flex-direction:column; gap:4px;">
                <label><input type="checkbox" id="cSpin" checked> Auto-spin</label>
                <label><input type="checkbox" id="cMouse" checked> Mouse FX</label>
                <label><input type="checkbox" id="cLines" checked> Constellations</label>
                <label><input type="checkbox" id="cComets" checked> Comets</label>
            </div>
        </div>
        <div class="divider"></div>
        <div class="group">
            <span>Actions</span>
            <div class="row" style="flex-direction:column; gap:4px;">
                <button id="btnMouse">Mouse: <b>Attract</b></button>
                <button id="btnFull">Fullscreen</button>
            </div>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('galaxy');
        const ctx = canvas.getContext('2d');

        const THEMES = {
            nebula:  { stars: ['#8ab4ff', '#c68fff', '#ff9de2', '#7effc6', '#ffffff'], bg: ['#1a1030', '#0a0e22', '#031018'] },
            aurora:  { stars: ['#4dffb8', '#7dffd4', '#00e5ff', '#9dffdd', '#ffffff'], bg: ['#06241c', '#02181f', '#030409'] },
            sunset:  { stars: ['#ff9e5e', '#ff5e7e', '#ffd166', '#ffb347', '#ffffff'], bg: ['#2a0a14', '#18060d', '#030409'] },
            mono:    { stars: ['#ffffff', '#cfcfcf', '#9f9f9f', '#ffffff', '#e8e8e8'], bg: ['#0a0a0a', '#050505', '#000000'] }
        };

        const config = {
            mode: 'galaxy',
            theme: 'nebula',
            count: 500,
            speed: 1,
            autoSpin: true,
            mouseFx: true,
            lines: true,
            comets: true,
            mouseMode: 'attract'
        };

        let W, H, DPR, rotation = 0;
        let particles = [], comets = [], stars = [], nebula = null, mouse = { x: -1e4, y: -1e4, active: false };
        let fireSeed = 0, fps = 0;

        function resize() {
            DPR = Math.min(window.devicePixelRatio || 1, 2);
            W = window.innerWidth; H = window.innerHeight;
            canvas.width = W * DPR; canvas.height = H * DPR;
            canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            init();
        }

        function pal() { return THEMES[config.theme].stars; }

        function pick() { const p = pal(); return p[Math.floor(Math.random() * p.length)]; }

        function init() {
            const cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.45;
            stars = [];
            for (let i = 0; i < 160; i++) stars.push({
                x: Math.random() * W, y: Math.random() * H,
                r: Math.random() * 1.6 + 0.2, tw: Math.random() * Math.PI * 2,
                layer: 0.3 + Math.random() * 0.7
            });

            particles = [];
            const n = config.count;
            const arms = 4;
            for (let i = 0; i < n; i++) {
                const arm = i % arms;
                const dist = Math.pow(Math.random(), 0.6) * R;
                const spread = (Math.random() - 0.5) * 0.55 * dist;
                const angle = (arm / arms) * Math.PI * 2 + dist * 0.14 + spread;
                particles.push(mkParticle(angle, dist));
            }
            buildNebula();
        }

        function mkParticle(angle, dist) {
            const cx = W / 2, cy = H / 2;
            const orbital = (0.6 + Math.random() * 1.1) / (dist * 0.12 + 0.6);
            return {
                angle, dist, orbital,
                x: cx + Math.cos(angle) * dist, y: cy + Math.sin(angle) * dist,
                size: Math.random() * 2.1 + 0.4, color: pick(),
                tw: Math.random() * Math.PI * 2, life: 1,
                baseAngle: angle
            };
        }

        function buildNebula() {
            const t = THEMES[config.theme].bg;
            const off = document.createElement('canvas');
            const s = Math.min(W, H) * 0.9;
            off.width = off.height = s;
            const octx = off.getContext('2d');
            const g = octx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
            g.addColorStop(0, t[0] + 'cc');
            g.addColorStop(0.45, t[1] + '66');
            g.addColorStop(1, t[2] + '00');
            octx.fillStyle = g;
            octx.fillRect(0, 0, s, s);
            for (let i = 0; i < 24; i++) {
                const x = s / 2 + (Math.random() - 0.5) * s * 0.7;
                const y = s / 2 + (Math.random() - 0.5) * s * 0.7;
                const r = s * (0.05 + Math.random() * 0.16);
                const cg = octx.createRadialGradient(x, y, 0, x, y, r);
                cg.addColorStop(0, pal()[i % pal().length] + '1f');
                cg.addColorStop(1, 'rgba(0,0,0,0)');
                octx.fillStyle = cg;
                octx.beginPath(); octx.arc(x, y, r, 0, Math.PI * 2); octx.fill();
            }
            nebula = off;
        }

        function update() {
            const cx = W / 2, cy = H / 2;
            if (config.autoSpin) rotation += 0.0016 * config.speed;

            const R = Math.min(W, H) * 0.45;

            for (const p of particles) {
                let a = p.baseAngle + rotation;
                let d = p.dist;

                if (config.mode === 'blackhole') {
                    d -= 0.55 * config.speed;
                    a += 0.02 * config.speed;
                    if (d < 4) { p.baseAngle = Math.random() * Math.PI * 2; p.dist = R; p.color = pick(); d = p.dist; }
                } else if (config.mode === 'fireworks') {
                    a += p.orbital * config.speed * 0.001;
                    p.life -= 0.0045 * config.speed;
                    d += Math.sin(p.tw) * 0.02 * config.speed;
                    if (p.life <= 0) { p.baseAngle = Math.random() * Math.PI * 2; p.dist = 0; p.life = 1; p.color = pick(); d = 0; }
                } else {
                    a += p.orbital * config.speed * 0.016;
                }

                if (config.mouseFx && mouse.active) {
                    const dx = cx + Math.cos(a) * d - mouse.x;
                    const dy = cy + Math.sin(a) * d - mouse.y;
                    const dd = Math.hypot(dx, dy);
                    if (dd > 0.1 && dd < 220) {
                        const f = (config.mouseMode === 'attract' ? 1 : -1) * (26 / (dd * dd + 1)) * config.speed;
                        d -= f;
                        a += f * 0.03;
                    }
                }

                p.angle = a; p.dist = Math.max(2, d);
                p.x = cx + Math.cos(p.angle) * p.dist;
                p.y = cy + Math.sin(p.angle) * p.dist;
                p.tw += 0.05;
            }

            if (config.comets && Math.random() < 0.012 * config.speed) {
                const fromX = Math.random() * W, fromY = -10;
                const toX = fromX + (Math.random() - 0.5) * W * 0.6;
                const toY = H * (0.4 + Math.random() * 0.5);
                comets.push({ x: fromX, y: fromY, vx: (toX - fromX) * 0.02, vy: (toY - fromY) * 0.02, life: 1 });
            }
            for (let i = comets.length - 1; i >= 0; i--) {
                const c = comets[i];
                c.x += c.vx * config.speed; c.y += c.vy * config.speed;
                c.life -= 0.008 * config.speed;
                if (c.life <= 0 || c.y > H || c.x < -50 || c.x > W + 50) comets.splice(i, 1);
            }
        }

        function draw() {
            ctx.fillStyle = 'rgba(3, 4, 9, 0.22)';
            ctx.fillRect(0, 0, W, H);

            if (nebula) {
                const s = nebula.width;
                ctx.globalAlpha = 0.35;
                ctx.drawImage(nebula, W / 2 - s / 2, H / 2 - s / 2);
                ctx.globalAlpha = 1;
            }

            for (const s of stars) {
                s.tw += 0.03;
                ctx.globalAlpha = 0.35 + Math.sin(s.tw) * 0.25;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.arc(s.x, s.y, s.r * s.layer, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1;

            const cx = W / 2, cy = H / 2;

            ctx.globalCompositeOperation = 'lighter';

            for (const c of comets) {
                ctx.globalAlpha = c.life * 0.9;
                const g = ctx.createLinearGradient(c.x, c.y, c.x - c.vx * 22, c.y - c.vy * 22);
                g.addColorStop(0, '#ffffff');
                g.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.strokeStyle = g;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(c.x, c.y);
                ctx.lineTo(c.x - c.vx * 22, c.y - c.vy * 22);
                ctx.stroke();
            }

            if (config.lines && particles.length <= 700) {
                ctx.lineWidth = 0.5;
                const step = particles.length > 400 ? 2 : 1;
                for (let i = 0; i < particles.length; i += step) {
                    const p = particles[i];
                    for (let j = i + step; j < particles.length; j += step) {
                        const q = particles[j];
                        const dx = p.x - q.x, dy = p.y - q.y;
                        const dd = dx * dx + dy * dy;
                        if (dd < 6400) {
                            const a = (1 - Math.sqrt(dd) / 80) * 0.12;
                            ctx.globalAlpha = a;
                            ctx.strokeStyle = p.color;
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y);
                            ctx.stroke();
                        }
                    }
                }
                ctx.globalAlpha = 1;
            }

            if (config.mode === 'blackhole') {
                const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(W, H) * 0.12);
                g.addColorStop(0, 'rgba(0,0,0,0.95)');
                g.addColorStop(0.7, 'rgba(60,50,120,0.35)');
                g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = g;
                ctx.beginPath(); ctx.arc(cx, cy, Math.min(W, H) * 0.12, 0, Math.PI * 2); ctx.fill();
            } else {
                const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(W, H) * 0.35);
                g.addColorStop(0, 'rgba(255,255,255,0.5)');
                g.addColorStop(0.12, pal()[0] + '55');
                g.addColorStop(0.5, pal()[1] + '22');
                g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = g;
                ctx.beginPath(); ctx.arc(cx, cy, Math.min(W, H) * 0.35, 0, Math.PI * 2); ctx.fill();
            }

            for (const p of particles) {
                const alpha = 0.45 + Math.sin(p.tw) * 0.3;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                const ang = Math.atan2(p.y - cy, p.x - cx);
                ctx.globalAlpha = alpha * 0.35;
                ctx.strokeStyle = p.color;
                ctx.lineWidth = p.size * 0.35;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x - Math.cos(ang) * 12, p.y - Math.sin(ang) * 12);
                ctx.stroke();
            }

            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1;

            if (mouse.active && config.mouseFx) {
                const r = config.mouseMode === 'attract' ? 220 : 160;
                ctx.strokeStyle = config.mouseMode === 'attract' ? 'rgba(140,180,255,0.4)' : 'rgba(255,140,140,0.4)';
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 6]);
                ctx.beginPath(); ctx.arc(mouse.x, mouse.y, r, 0, Math.PI * 2); ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        let last = performance.now();
        function loop(t) {
            const dt = t - last;
            if (dt > 0) { fps = fps * 0.9 + (1000 / dt) * 0.1; }
            last = t;
            document.getElementById('fps').textContent = Math.round(fps) + ' FPS';
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function setMode(m) {
            config.mode = m;
            document.querySelectorAll('#ui .group:first-child button').forEach(b => b.classList.remove('active'));
            document.getElementById('m' + m[0].toUpperCase() + m.slice(1)).classList.add('active');
            init();
        }

        function setTheme(t) {
            config.theme = t;
            document.querySelectorAll('#ui .group:nth-child(3) button').forEach(b => b.classList.remove('active'));
            document.getElementById('t' + t[0].toUpperCase() + t.slice(1)).classList.add('active');
            for (const p of particles) p.color = pick();
            buildNebula();
        }

        function cycleMouse() {
            const modes = ['attract', 'repel'];
            const i = modes.indexOf(config.mouseMode);
            config.mouseMode = modes[(i + 1) % modes.length];
            document.querySelector('#btnMouse b').textContent = config.mouseMode === 'attract' ? 'Attract' : 'Repel';
        }

        document.getElementById('mGalaxy').onclick = () => setMode('galaxy');
        document.getElementById('mRing').onclick = () => setMode('ring');
        document.getElementById('mHole').onclick = () => setMode('blackhole');
        document.getElementById('mFire').onclick = () => setMode('fireworks');
        document.getElementById('tNebula').onclick = () => setTheme('nebula');
        document.getElementById('tAurora').onclick = () => setTheme('aurora');
        document.getElementById('tSunset').onclick = () => setTheme('sunset');
        document.getElementById('tMono').onclick = () => setTheme('mono');
        document.getElementById('sParticles').oninput = e => { config.count = +e.target.value; document.getElementById('pCount').textContent = config.count; init(); };
        document.getElementById('sSpeed').oninput = e => { config.speed = +e.target.value; document.getElementById('pSpeed').textContent = (+e.target.value).toFixed(1); };
        document.getElementById('cSpin').onchange = e => config.autoSpin = e.target.checked;
        document.getElementById('cMouse').onchange = e => config.mouseFx = e.target.checked;
        document.getElementById('cLines').onchange = e => config.lines = e.target.checked;
        document.getElementById('cComets').onchange = e => config.comets = e.target.checked;
        document.getElementById('btnMouse').onclick = cycleMouse;
        document.getElementById('btnFull').onclick = () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        };

        canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
        canvas.addEventListener('mouseleave', () => { mouse.active = false; });
        canvas.addEventListener('touchmove', e => { const t = e.touches[0]; mouse.x = t.clientX; mouse.y = t.clientY; mouse.active = true; }, { passive: true });
        canvas.addEventListener('touchend', () => { mouse.active = false; });

        window.addEventListener('keydown', e => {
            switch (e.key) {
                case '1': setMode('galaxy'); break;
                case '2': setMode('ring'); break;
                case '3': setMode('blackhole'); break;
                case '4': setMode('fireworks'); break;
                case ' ': config.autoSpin = !config.autoSpin; document.getElementById('cSpin').checked = config.autoSpin; e.preventDefault(); break;
                case 'm': case 'M': cycleMouse(); break;
                case 'f': case 'F': document.getElementById('btnFull').click(); break;
                case 'c': case 'C': config.lines = !config.lines; document.getElementById('cLines').checked = config.lines; break;
            }
        });

        window.addEventListener('resize', resize);
        resize();
        loop();
    </script>
</body>
</html>
